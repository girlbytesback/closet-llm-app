[project]
name = "closetllm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.119.0",
    "pillow>=11.3.0",
]

[project.scripts]
closetllm = "closetllm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/closetllm"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
