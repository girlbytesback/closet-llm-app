[project]
name = "closetllm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.119.0",
    "fastapi>=0.128.8",
    "pillow>=11.3.0",
    "uvicorn>=0.39.0",
]

[project.scripts]
closetllm = "closetllm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/closetllm"]

[tool.pytest.ini_options]
testpaths = ["src/test"]
# so `evals` and `closetllm` import the same way with or without the editable install
pythonpath = ["src"]
addopts = "-ra"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
]
